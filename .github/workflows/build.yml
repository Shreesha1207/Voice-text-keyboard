name: Build & Release Xvoice

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows (.exe) ────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify spec file
        shell: pwsh
        run: |
          if (!(Test-Path "xvoice.spec")) {
            Write-Error "xvoice.spec not found! Commit it to the repo."
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pynput python-dotenv requests pystray Pillow pyinstaller
          pip install PyAudio --find-links https://github.com/intxcc/pyaudio_portaudio/releases

      - name: Build xvoice.exe
        run: pyinstaller --noconfirm xvoice.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist\xvoice.exe")) {
            Write-Error "Build failed: dist/xvoice.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xvoice-windows
          path: dist/xvoice.exe

  # ── macOS (.dmg) ──────────────────────────────────────────────────────
  # PyInstaller can only freeze for the arch it runs on (there are no
  # universal2 wheels for PyAudio/PySide6), so we build one DMG per arch:
  #   macos-14 -> Apple Silicon (M1/M2/M3/M4)
  #   macos-13 -> Intel
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: brew install portaudio create-dmg

      - name: Build Xvoice.app
        # build_mac.sh installs from requirements.txt, generates the .icns,
        # bundles ffmpeg and signs the bundle.
        env:
          PYTHON: python
        run: |
          chmod +x build_mac.sh installer_mac.sh mac/first-run.command
          ./build_mac.sh

      - name: Verify app exists
        run: |
          if [ ! -d "dist/Xvoice.app" ]; then
            echo "Build failed: Xvoice.app not found"
            exit 1
          fi
          echo "Bundle arch:"
          lipo -archs dist/Xvoice.app/Contents/MacOS/xvoice || true

      - name: Create .dmg installer
        run: |
          chmod +x installer_mac_pkg.sh mac/pkg-scripts/postinstall
          ./installer_mac.sh

      - name: Create .pkg installer
        # The .pkg is the recommended download: its postinstall script clears
        # quarantine, registers launch-at-login and starts the app, so the
        # user has no manual "First Run" step.
        run: ./installer_mac_pkg.sh

      - name: Normalize installer names
        # Ship predictable download names regardless of the version bump.
        run: |
          for ext in dmg pkg; do
            SRC=$(ls dist/Xvoice-*-${{ matrix.arch }}.$ext 2>/dev/null | head -1)
            if [ -z "$SRC" ]; then
              echo "$ext creation failed"
              exit 1
            fi
            mv "$SRC" "dist/Xvoice-${{ matrix.arch }}.$ext"
          done
          ls -lh dist/Xvoice-${{ matrix.arch }}.*

      - name: Preflight the built bundle
        # Runs on the real macOS runner — catches an arch mismatch, a missing
        # Info.plist key or a broken signature before we publish it.
        run: python mac/preflight.py || true

      - uses: actions/upload-artifact@v4
        with:
          name: xvoice-macos-${{ matrix.arch }}
          path: |
            dist/Xvoice-${{ matrix.arch }}.dmg
            dist/Xvoice-${{ matrix.arch }}.pkg

  # ── Linux (.AppImage) ─────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            python3-dev \
            gcc \
            libfuse2 \
            fuse \
            xvfb \
            gir1.2-gtk-3.0 \
            gir1.2-appindicator3-0.1 \
            libayatana-appindicator3-dev
          sudo apt-get install -y libgirepository1.0-dev || \
          sudo apt-get install -y libgirepository-1.0-dev

      - name: Install Python dependencies
        run: pip install pyaudio pynput python-dotenv requests pystray Pillow pyinstaller

      - name: Build xvoice binary
        run: xvfb-run pyinstaller --noconfirm xvoice.spec

      - name: Verify binary exists
        run: |
          if [ ! -f "dist/xvoice" ]; then
            echo "Build failed: xvoice binary not found"
            exit 1
          fi

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/xvoice AppDir/usr/bin/xvoice
          chmod +x AppDir/usr/bin/xvoice

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="${SELF%/*}"
          export PATH="${HERE}/usr/bin/:${PATH}"
          exec "${HERE}/usr/bin/xvoice" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/xvoice.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Xvoice
          Exec=xvoice
          Icon=xvoice
          Comment=Press F8 anywhere to instantly convert your voice to text
          Categories=Utility;
          NoDisplay=false
          EOF

          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (0,0,0,0))
          d = ImageDraw.Draw(img)
          d.ellipse([0,0,255,255], fill=(124,58,237,255))
          d.rounded_rectangle([82,30,174,150], radius=38, fill='white')
          d.arc([54,96,202,208], start=0, end=180, fill='white', width=14)
          d.line([128,208,128,240], fill='white', width=14)
          d.line([96,240,160,240], fill='white', width=14)
          img.save('AppDir/xvoice.png')
          "

      - name: Package as AppImage
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/Xvoice-x86_64.AppImage

      - name: Verify AppImage exists
        run: |
          if [ ! -f "dist/Xvoice-x86_64.AppImage" ]; then
            echo "AppImage creation failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xvoice-linux
          path: dist/Xvoice-x86_64.AppImage

  # ── GitHub Release (waits for all 3 builds) ───────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Xvoice ${{ github.ref_name }}"
          files: |
            artifacts/xvoice-windows/xvoice.exe
            artifacts/xvoice-macos-arm64/Xvoice-arm64.pkg
            artifacts/xvoice-macos-arm64/Xvoice-arm64.dmg
            artifacts/xvoice-macos-x86_64/Xvoice-x86_64.pkg
            artifacts/xvoice-macos-x86_64/Xvoice-x86_64.dmg
            artifacts/xvoice-linux/Xvoice-x86_64.AppImage
          body: |
            ## Xvoice ${{ github.ref_name }}

            | Platform | Download | Instructions |
            |----------|----------|--------------|
            | 🪟 Windows | `xvoice.exe` | Double-click to run |
            | 🍎 macOS (Apple Silicon) | **`Xvoice-arm64.pkg`** ← recommended | Double-click, click through the installer. Done. |
            | 🍎 macOS (Intel) | **`Xvoice-x86_64.pkg`** ← recommended | Double-click, click through the installer. Done. |
            | 🍎 macOS (drag-install) | `Xvoice-*.dmg` | Drag to Applications → run **First Run.command** |
            | 🐧 Linux  | `Xvoice-x86_64.AppImage` | `chmod +x Xvoice-x86_64.AppImage && ./Xvoice-x86_64.AppImage` |

            Not sure which Mac you have?  → About This Mac.
            "Apple M1/M2/M3/M4" = **arm64**, "Intel" = **x86_64**.
            The two are not interchangeable — the wrong one will not open.

            ### First run
            Your browser will open automatically to link your Xvoice account.
            Press **F8** anywhere on your computer to start dictating.

            ### macOS notes

            **Xvoice has no Dock icon.** It is a menu-bar app — look for the
            purple microphone at the **top-right of your screen**, next to the
            clock. If you opened it and "nothing happened", it is almost
            certainly running up there.

            The build is not notarized yet, so macOS will warn on first open:

            - **`.pkg`** — right-click → *Open* → *Open*. Everything else
              (quarantine, launch-at-login, first launch) is automatic.
            - **`.dmg`** — run **First Run.command** after dragging.

            Xvoice needs **Microphone**, **Accessibility** and **Input
            Monitoring** in System Settings → Privacy & Security. The last two
            only list Xvoice *after* its first launch, and you must restart
            Xvoice after granting them.

            Something not working? Run `python3 mac/preflight.py` from the
            repo — it tells you exactly which step failed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}